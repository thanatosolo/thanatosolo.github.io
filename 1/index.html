<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THANATOSOLO</title>
    <!-- 圆润字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            cursor: none;
            background-image: url('https://pic1.imgdb.cn/i/033xh33EZ3PtL19TphPUL3.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            max-width: 820px;
            width: 100%;
            text-align: center;
            padding: 40px 30px 50px;
            border-radius: 72px 72px 48px 48px;
            transition: all 0.2s;
        }

        /* ===== 标题：圆润字体 + 动态炫彩 ===== */
        .title-wrapper {
            display: inline-block;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 3px;
            /* 圆润字体 */
            font-family: 'Quicksand', 'Nunito', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(90deg, 
                #f093fb 0%, 
                #f5576c 20%, 
                #4facfe 40%, 
                #43e97b 60%, 
                #f093fb 80%, 
                #f5576c 100%
            );
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientFlow 4s ease-in-out infinite alternate;
            text-shadow: 0 0 60px rgba(245, 87, 108, 0.15);
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== 搜索框 + 开关 横向排列 ===== */
        .search-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 34px;
            width: 100%;
        }

        .search-box {
            flex: 1;
            padding: 16px 24px;
            border-radius: 80px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 1px;
            outline: none;
            transition: 0.25s ease;
            color: #1a1a1a;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
            font-family: 'Inter', sans-serif;
        }
        .search-box:focus {
            border-color: rgba(255,255,255,0.6);
            box-shadow: 0 0 0 6px rgba(255,255,255,0.08);
            background: rgba(255, 255, 255, 0.25);
        }
        .search-box::placeholder {
            color: rgba(0,0,0,0.35);
            font-weight: 200;
            letter-spacing: 2px;
        }

        .switch-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.8);
            text-shadow: 0 1px 6px rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(4px);
            padding: 6px 14px 6px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .switch-wrap span {
            white-space: nowrap;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(200,185,170,0.5);
            transition: .3s;
            border-radius: 40px;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.04);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: #fcf8f2;
            transition: .3s;
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        input:checked + .slider { background-color: #b8a08c; }
        input:checked + .slider:before { transform: translateX(16px); background-color: #fffcf5; }

        /* ===== 卡片网格 — 整齐排列 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);  /* 最大化时6列均分 */
            gap: 14px;
            margin-top: 6px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            padding: 14px 6px 12px;
            border-radius: 32px 12px 32px 12px;
            text-decoration: none;
            color: #1a1a1a;
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
            transform: scale(1);
            will-change: transform;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 80px;
        }

        .card:hover {
            transform: translateY(-4px) scale(1.02);
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255,255,255,0.4);
            box-shadow: 0 18px 40px -8px rgba(0,0,0,0.15), 0 0 30px rgba(245, 87, 108, 0.08);
            color: transparent;
            background-image: linear-gradient(135deg, #f093fb 0%, #f5576c 40%, #4facfe 80%, #43e97b 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card:hover .icon {
            -webkit-text-fill-color: initial;
            color: initial;
            filter: drop-shadow(0 4px 10px rgba(245, 87, 108, 0.2));
        }
        .card span:not(.icon) {
            display: inline-block;
        }
        .card:hover span:not(.icon) {
            background-image: linear-gradient(135deg, #f093fb 0%, #f5576c 40%, #4facfe 80%, #43e97b 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 4px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.04));
            transition: 0.2s;
            -webkit-text-fill-color: initial;
            color: initial;
        }
        .card:hover .icon {
            transform: scale(1.06) rotate(-2deg);
        }

        /* ===== 响应式：窄屏时自动换行 ===== */
        @media (max-width: 700px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 500px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .container { padding: 30px 18px; border-radius: 48px; }
            h1 { font-size: 36px; letter-spacing: 3px; }
            .card { padding: 12px 4px 10px; min-height: 70px; border-radius: 24px 8px 24px 8px; }
            .card .icon { font-size: 24px; }
            .search-row { flex-wrap: wrap; gap: 8px; }
            .switch-wrap { padding: 4px 12px 4px 14px; }
        }
        @media (max-width: 380px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ===== 自定义光标 ===== */
        .cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 28px;
            height: 28px;
            border: 1.5px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease, width 0.15s, height 0.15s, background 0.2s;
            will-change: transform;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(2px);
            box-shadow: 0 0 12px rgba(0,0,0,0.06);
        }
        .cursor-follower {
            position: fixed;
            top: 0;
            left: 0;
            width: 6px;
            height: 6px;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.4, 1), width 0.2s, height 0.2s;
            will-change: transform;
            box-shadow: 0 0 18px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <div class="container">
        <!-- 标题：圆润字体 + 动态炫彩 -->
        <div class="title-wrapper">
            <h1>THANATOSOLO</h1>
        </div>

        <!-- 搜索框 + 开关 横向排列 -->
        <div class="search-row">
            <input class="search-box" type="text" placeholder="键入 探索 …" onkeydown="if(event.key==='Enter'){window.location.href='https://www.baidu.com/s?wd='+this.value}">
            <div class="switch-wrap">
                <span>↗ 新窗</span>
                <label class="switch">
                    <input type="checkbox" id="newtabSwitch">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- 卡片网格 — 整齐排列 -->
        <div class="grid">
            <a data-href="https://luci.thanatosolo.duckdns.org:8888" class="card"><span class="icon">🖥️</span>iStoreOS</a>
            <a data-href="https://op.thanatosolo.duckdns.org:8888" class="card"><span class="icon">📦</span>OpenList</a>
            <a data-href="https://fb.thanatosolo.duckdns.org:8888" class="card"><span class="icon">📁</span>FileBrowser</a>
            <a data-href="https://ar.thanatosolo.duckdns.org:8888" class="card"><span class="icon">⬇️</span>AriaNG</a>
            <a data-href="https://ssh.thanatosolo.duckdns.org:8888" class="card"><span class="icon">💻</span>TTYD</a>
            <a data-href="https://qb.thanatosolo.duckdns.org:8888" class="card"><span class="icon">🌱</span>qBittorrent</a>
            <a data-href="https://je.thanatosolo.duckdns.org:8888" class="card"><span class="icon">🎬</span>Jellyfin</a>
            <a data-href="https://pp.thanatosolo.duckdns.org:8888" class="card"><span class="icon">🖼️</span>PhotoPrism</a>
            <a data-href="https://kd.thanatosolo.duckdns.org:8888" class="card"><span class="icon">🗂️</span>可道云</a>
            <a data-href="https://mt.thanatosolo.duckdns.org:8888" class="card"><span class="icon">📷</span>MT Photos</a>
            <a data-href="https://ai.thanatosolo.duckdns.org:8888" class="card"><span class="icon">🤖</span>AI</a>
            <a data-href="https://dav.thanatosolo.duckdns.org:8888" class="card"><span class="icon">☁️</span>WebDAV</a>
        </div>
    </div>

<script>
    // ===== 鼠标跟随 =====
    const cursor = document.querySelector('.cursor');
    const follower = document.querySelector('.cursor-follower');
    let mouseX = 0, mouseY = 0;
    let curX = 0, curY = 0;
    let folX = 0, folY = 0;

    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    function animateCursor() {
        curX += (mouseX - curX) * 0.12;
        curY += (mouseY - curY) * 0.12;
        cursor.style.left = curX + 'px';
        cursor.style.top = curY + 'px';

        folX += (mouseX - folX) * 0.04;
        folY += (mouseY - folY) * 0.04;
        follower.style.left = folX + 'px';
        follower.style.top = folY + 'px';

        requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // ===== 悬停放大光标 =====
    const hoverTargets = document.querySelectorAll('.card, .search-box, .switch');
    hoverTargets.forEach(el => {
        el.addEventListener('mouseenter', () => {
            cursor.style.width = '42px';
            cursor.style.height = '42px';
            cursor.style.borderColor = 'rgba(255,255,255,0.9)';
            cursor.style.background = 'rgba(255,255,255,0.08)';
            cursor.style.boxShadow = '0 0 30px rgba(0,0,0,0.08)';
            follower.style.width = '10px';
            follower.style.height = '10px';
            follower.style.background = 'rgba(255,255,255,0.9)';
        });
        el.addEventListener('mouseleave', () => {
            cursor.style.width = '28px';
            cursor.style.height = '28px';
            cursor.style.borderColor = 'rgba(255,255,255,0.7)';
            cursor.style.background = 'rgba(255,255,255,0.05)';
            cursor.style.boxShadow = '0 0 12px rgba(0,0,0,0.06)';
            follower.style.width = '6px';
            follower.style.height = '6px';
            follower.style.background = 'rgba(255,255,255,0.7)';
        });
    });

    // ===== 新标签开关 =====
    const switchEl = document.getElementById('newtabSwitch');
    const cards = document.querySelectorAll('.card');
    let useNewTab = localStorage.getItem('openNewTab') === 'true';
    switchEl.checked = useNewTab;

    switchEl.addEventListener('change', () => {
        useNewTab = switchEl.checked;
        localStorage.setItem('openNewTab', useNewTab);
    });

    cards.forEach(card => {
        card.addEventListener('click', (e) => {
            e.preventDefault();
            const url = card.dataset.href;
            if (useNewTab) {
                window.open(url, '_blank');
            } else {
                window.location.href = url;
            }
        });
    });
</script>

</body>
</html>
