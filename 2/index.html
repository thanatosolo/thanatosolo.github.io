<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expiration Date</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Inter", "Segoe UI", "PingFang SC", system-ui, -apple-system, sans-serif;
            background: url('https://pic1.imgdb.cn/i/033xh33EZ3PtL19TphPUL3.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #c9d1d9;
            padding: 30px 20px;
            min-height: 100vh;
            cursor: none;
            user-select: none;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.70);
            z-index: 0;
            pointer-events: none;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* ===== 顶部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(33, 38, 45, 0.8);
            padding-bottom: 16px;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(90deg, #ff3366, #ff8833, #ffcc33, #33dd88, #33aaff, #aa66ff, #ff33aa, #ff3366);
            background-size: 400% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: textRainbowFlow 8s linear infinite;
            text-shadow: 0 0 40px rgba(255, 100, 200, 0.4);
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
            letter-spacing: 2px;
        }
        .header h1:hover {
            transform: scale(1.05);
            filter: brightness(1.3);
        }
        @keyframes textRainbowFlow {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 400% 50%;
            }
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .view-btn {
            background: rgba(33, 38, 45, 0.8);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(48, 54, 61, 0.8);
            color: #8b949e;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }
        .view-btn:hover {
            background: rgba(48, 54, 61, 0.8);
        }
        .view-btn.active {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #fff;
        }

        /* ===== 卡片视图 ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .card-group {
            background: rgba(22, 27, 34, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 14px;
            padding: 16px 18px;
            transition: 0.3s;
            cursor: none;
        }
        .card-group:hover {
            border-color: #58a6ff;
            box-shadow: 0 0 40px rgba(88, 166, 255, 0.2);
            transform: translateY(-2px);
        }

        .card-site {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(33, 38, 45, 0.8);
            padding-bottom: 10px;
            margin-bottom: 10px;
            pointer-events: none;
        }
        .card-site a {
            color: #58a6ff;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            pointer-events: none;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .card-site .account {
            font-size: 11px;
            font-weight: 600;
            background: rgba(33, 38, 45, 0.8);
            padding: 2px 10px;
            border-radius: 20px;
            color: #8b949e;
            border: 1px solid rgba(48, 54, 61, 0.8);
            white-space: nowrap;
        }

        .card-domain {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
            gap: 10px;
            white-space: nowrap;
        }

        .card-domain .name {
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex-shrink: 1;
        }
        .card-domain .name a {
            color:#79c0ff;
            text-decoration:none;
        }
        .card-domain .name a:hover {
            color:#a5d6ff;
            text-decoration:underline;
        }

        .card-domain .expire {
            color: #a0a8b4;
            font-size: 13px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .card-domain .days {
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            text-align: right;
        }
        .card-domain .days.urgent {
            color: #f85149;
            animation: blinkRed 1s step-end infinite;
        }
        .card-domain .days.unknown {
            color: #484f58;
        }
        .card-domain .no-data {
            color: #484f58;
            font-size: 12px;
            font-weight: 500;
        }

        /* ===== 列表视图 ===== */
        .list-view .site-group {
            background: rgba(22, 27, 34, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 14px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: 0.3s;
            cursor: none;
        }
        .list-view .site-group:hover {
            border-color: #58a6ff;
            box-shadow: 0 0 40px rgba(88, 166, 255, 0.15);
        }
        .list-view .site-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            background: rgba(28, 35, 51, 0.6);
            border-bottom: 1px solid rgba(48, 54, 61, 0.8);
            flex-wrap: wrap;
            pointer-events: none;
        }
        .list-view .site-header a {
            color: #58a6ff;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            pointer-events: none;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .list-view .site-header .account {
            font-size: 11px;
            font-weight: 600;
            background: rgba(33, 38, 45, 0.8);
            padding: 2px 12px;
            border-radius: 20px;
            color: #8b949e;
            border: 1px solid rgba(48, 54, 61, 0.8);
            white-space: nowrap;
        }
        .list-view .domain-list {
            padding: 2px 0;
        }
        .list-view .domain-row {
            display: flex;
            align-items: center;
            padding: 8px 20px;
            border-bottom: 1px solid rgba(33, 38, 45, 0.8);
            gap: 14px;
            white-space: nowrap;
        }
        .list-view .domain-row:last-child {
            border-bottom: none;
        }
        .list-view .domain-row .name {
            font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0px;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-view .domain-row .name a {
            color:#79c0ff;
            text-decoration:none;
        }
        .list-view .domain-row .name a:hover {
            color:#a5d6ff;
            text-decoration:underline;
        }
        .list-view .domain-row .expire {
            font-size: 13px;
            font-weight: 500;
            color: #a0a8b4;
            flex-shrink: 0;
        }
        .list-view .domain-row .days {
            font-size: 14px;
            font-weight: 700;
            flex-shrink: 0;
            text-align: right;
        }
        .list-view .domain-row .days.urgent {
            color: #f85149;
            animation: blinkRed 1s step-end infinite;
        }
        .list-view .domain-row .days.unknown {
            color: #8b949e;
        }
        .list-view .no-data {
            color: #484f58;
            font-size: 13px;
            font-weight: 500;
        }

        /* ===== 通用 ===== */
        @keyframes blinkRed {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            font-weight: 500;
            color: #c9d1d9;
            text-align: center;
            border-top: 1px solid rgba(33, 38, 45, 0.8);
            padding: 14px 20px;
            background: rgba(13, 17, 23, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .footer code {
            background: rgba(22, 27, 34, 0.9);
            padding: 2px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #f0f6fc;
        }

        /* 加载状态 */
        .loading {
            color: #8b949e;
            font-size: 18px;
            padding: 40px 0;
            text-align: center;
            text-shadow: 0 0 12px rgba(0,0,0,0.7);
        }
        .loading::after {
            content: '...';
            animation: dots 1.2s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        @media (max-width: 600px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
            .list-view .domain-row {
                flex-wrap: wrap;
                white-space: normal;
            }
            .list-view .site-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header h1 {
                font-size: 24px;
            }
            .card-domain {
                flex-wrap: wrap;
                white-space: normal;
            }
        }

        /* ===== 自定义光标 ===== */
        #cursor {
            position: fixed;
            width: 50px;
            height: 50px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 20px #58a6ff);
        }
        .ring-outer {
            width: 100%;
            height: 100%;
            border: 1.8px solid rgba(88, 166, 255, 0.6);
            border-radius: 50%;
            animation: rotateSlow 12s linear infinite;
            box-shadow: 0 0 30px rgba(88, 166, 255, 0.2), inset 0 0 30px rgba(88, 166, 255, 0.1);
        }
        .ring-inner {
            position: absolute;
            width: 60%;
            height: 60%;
            border: 2.5px solid rgba(255, 140, 220, 0.7);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: rotateReverse 8s linear infinite, pulseGlow 2.8s ease-in-out infinite;
            box-shadow: 0 0 28px rgba(255, 112, 192, 0.5), 0 0 50px rgba(176, 80, 255, 0.3);
        }
        .center-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #ffffff, #b0a0ff);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px #ffffff, 0 0 60px #8060ff, 0 0 100px #a070ff;
            animation: pulseDot 2s ease-in-out infinite alternate;
        }

        @keyframes rotateSlow {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        @keyframes rotateReverse {
            from {
                transform: translate(-50%, -50%) rotate(360deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(0deg);
            }
        }
        @keyframes pulseGlow {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }
        @keyframes pulseDot {
            0% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 30px #fff, 0 0 60px #8060ff;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.3);
                box-shadow: 0 0 50px #ffb0ff, 0 0 100px #a070ff;
            }
        }

        #trailCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9998;
            mix-blend-mode: screen;
        }
    </style>
</head>
<body>
    <canvas id="trailCanvas"></canvas>
    <div id="cursor">
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        <div class="center-dot"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1 onclick="window.location.href='../'">📋 Expiration Date</h1>
            <div class="header-controls">
                <button class="view-btn active" data-view="card">📐 Card</button>
                <button class="view-btn" data-view="list">📋 List</button>
            </div>
        </div>

        <div id="app"><div class="loading">加载中</div></div>
        <div class="footer">
            💡 Click site name to renew · Red blink ≤30 days · Edit data in <code>domains.json</code>
        </div>
    </div>

    <script>
        // ============================================================
        // 工具函数
        // ============================================================
        function daysUntil(expire) {
            if (!expire) return null;
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const target = new Date(expire);
            const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
            return diff;
        }

        function formatExpire(expire) {
            if (!expire) return '<span class="no-data">—</span>';
            return expire;
        }

        // ============================================================
        // 分组
        // ============================================================
        function getGroups(domains) {
            const groups = {};
            domains.forEach(item => {
                const key = item.site;
                if (!groups[key]) {
                    groups[key] = { site: item.site, url: item.url, domains: [] };
                }
                groups[key].domains.push({
                    domain: item.domain,
                    expire: item.expire,
                    account: item.account
                });
            });
            const sorted = {};
            Object.keys(groups).sort().forEach(key => { sorted[key] = groups[key]; });
            return sorted;
        }

        // ============================================================
        // 渲染
        // ============================================================
        let currentView = localStorage.getItem('domainView') || 'card';

        function render(domains) {
            const groups = getGroups(domains);
            const app = document.getElementById('app');

            if (currentView === 'card') {
                app.className = 'card-grid';
                let html = '';
                for (const key in groups) {
                    const group = groups[key];
                    html += `<div class="card-group" data-url="${group.url}">`;
                    html += `<div class="card-site">`;
                    html += `<a href="${group.url}" target="_blank">🔗 ${group.site}</a>`;
                    const accounts = [...new Set(group.domains.map(d => d.account))];
                    accounts.forEach(acc => { html += `<span class="account">${acc}</span>`; });
                    html += `</div>`;

                    group.domains.forEach(d => {
                        const remain = daysUntil(d.expire);
                        let daysClass = 'days';
                        let daysText = '';
                        if (remain === null) { daysClass += ' unknown';
                            daysText = '—'; } else if (remain < 0) { daysClass += ' urgent';
                            daysText = 'Expired ⚠️'; } else if (remain <= 30) { daysClass += ' urgent';
                            daysText = `${remain}d ⚠️`; } else { daysText = `${remain}d`; }

                        html += `<div class="card-domain">`;
                        html += `<span class="name" title="${d.domain}"><a href="https://${d.domain}" target="_blank" onclick="event.stopPropagation()">${d.domain}</a></span>`;
                        html += `<span class="expire">${formatExpire(d.expire)}</span>`;
                        html += `<span class="${daysClass}">${daysText}</span>`;
                        html += `</div>`;
                    });
                    html += `</div>`;
                }
                app.innerHTML = html;

                document.querySelectorAll('.card-group').forEach(el => {
                    el.addEventListener('click', function() {
                        const url = this.dataset.url;
                        if (url) window.open(url, '_blank');
                    });
                });

            } else {
                app.className = 'list-view';
                let html = '';
                for (const key in groups) {
                    const group = groups[key];
                    html += `<div class="site-group" data-url="${group.url}">`;
                    html += `<div class="site-header">`;
                    html += `<a href="${group.url}" target="_blank">🔗 ${group.site}</a>`;
                    const accounts = [...new Set(group.domains.map(d => d.account))];
                    accounts.forEach(acc => { html += `<span class="account">${acc}</span>`; });
                    html += `</div><div class="domain-list">`;

                    group.domains.forEach(d => {
                        const remain = daysUntil(d.expire);
                        let daysClass = 'days';
                        let daysText = '';
                        if (remain === null) { daysClass += ' unknown';
                            daysText = '—'; } else if (remain < 0) { daysClass += ' urgent';
                            daysText = 'Expired ⚠️'; } else if (remain <= 30) { daysClass += ' urgent';
                            daysText = `${remain}d ⚠️`; } else { daysText = `${remain}d`; }

                        html += `<div class="domain-row">`;
                        html += `<span class="name" title="${d.domain}"><a href="https://${d.domain}" target="_blank" onclick="event.stopPropagation()">${d.domain}</a></span>`;
                        html += `<span class="expire">${formatExpire(d.expire)}</span>`;
                        html += `<span class="${daysClass}">${daysText}</span>`;
                        html += `</div>`;
                    });
                    html += `</div></div>`;
                }
                app.innerHTML = html;

                document.querySelectorAll('.site-group').forEach(el => {
                    el.addEventListener('click', function() {
                        const url = this.dataset.url;
                        if (url) window.open(url, '_blank');
                    });
                });
            }

            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === currentView);
            });
        }

        // ============================================================
        // 从 domains.json 加载数据
        // ============================================================
        async function loadDomains() {
            try {
                const response = await fetch('domains.json?t=' + Date.now());
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                const data = await response.json();
                render(data.domains);
            } catch (error) {
                console.error('加载数据失败:', error);
                const app = document.getElementById('app');
                app.innerHTML = `
                    <div style="color:#f85149;font-size:16px;padding:40px 0;text-align:center;">
                        ⚠️ 加载数据失败，请检查 domains.json 文件是否存在
                        <br><span style="font-size:13px;color:#8b949e;">${error.message}</span>
                    </div>
                `;
            }
        }

        // ============================================================
        // 切换视图
        // ============================================================
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentView = btn.dataset.view;
                localStorage.setItem('domainView', currentView);
                // 重新加载数据并渲染
                loadDomains();
            });
        });

        // ============================================================
        // 光标 + 残影
        // ============================================================
        const cursor = document.getElementById('cursor');
        const canvas = document.getElementById('trailCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const trailPoints = [];
        const maxTrailLength = 64;
        let mouseX = 0,
            mouseY = 0;

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
            trailPoints.push({ x: mouseX, y: mouseY, alpha: 1 });
            if (trailPoints.length > maxTrailLength) trailPoints.shift();
        });

        function drawTrail() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 1; i < trailPoints.length; i++) {
                const p1 = trailPoints[i - 1];
                const p2 = trailPoints[i];
                p1.alpha -= 0.016;
                if (p1.alpha <= 0) continue;
                const progress = i / trailPoints.length;
                const hue = (210 + progress * 60) % 360;
                const alphaVal = p1.alpha * 0.9;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                const lineWidth = 3.5 + 6 * (1 - progress);
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = `hsla(${hue}, 90%, 70%, ${alphaVal})`;
                ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.6)`;
                ctx.shadowBlur = 22;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineWidth = lineWidth * 0.35;
                ctx.strokeStyle = `hsla(${hue + 30}, 100%, 90%, ${alphaVal * 0.7})`;
                ctx.shadowBlur = 40;
                ctx.shadowColor = `hsla(${hue + 20}, 100%, 80%, 0.5)`;
                ctx.stroke();
            }
            if (trailPoints.length > 2) {
                const last = trailPoints[trailPoints.length - 1];
                ctx.shadowBlur = 80;
                for (let j = 0; j < 6; j++) {
                    const angle = j * 1.2 + Date.now() * 0.001;
                    const dist = 12 + Math.sin(Date.now() * 0.005 + j) * 6;
                    const px = last.x + Math.cos(angle) * dist;
                    const py = last.y + Math.sin(angle) * dist;
                    ctx.beginPath();
                    ctx.arc(px, py, 2 + Math.sin(Date.now() * 0.01 + j) * 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${210 + j * 20}, 100%, 80%, 0.5)`;
                    ctx.shadowColor = `hsla(${210 + j * 20}, 100%, 70%, 0.7)`;
                    ctx.shadowBlur = 40;
                    ctx.fill();
                }
            }
            requestAnimationFrame(drawTrail);
        }
        drawTrail();

        // ============================================================
        // 启动
        // ============================================================
        loadDomains();
    </script>
</body>
</html>
