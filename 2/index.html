<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('https://pic1.imgdb.cn/i/033xh33EZ3PtL19TphPUL3.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            overflow-x: hidden;
            cursor: none;
        }

        .container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 6vh 4vw;
            gap: 48px;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            gap: 26px;
            flex-wrap: wrap;
        }

        .title {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: 8px;
            color: #ffffff;
            position: relative;
            text-shadow:
                0 0 1px #000,
                1px 1px 2px #000,
                -1px -1px 2px #000,
                0 0 4px #c963b3,
                0 0 9px #8b57b8,
                0 0 16px #4e3480;

            animation: titleNeonGlow 3.8s ease-in-out infinite alternate;
        }

        .title::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            color: transparent;
            background: linear-gradient(135deg, #b87890, #a070b8, #7c68b4);
            background-clip: text;
            -webkit-background-clip: text;
            opacity: 0.7;
            z-index: -1;
            filter: blur(1px);
        }

        @keyframes titleNeonGlow {
            0% {
                text-shadow:
                    0 0 1px #000,
                    1px 1px 2px #000,
                    -1px -1px 2px #000,
                    0 0 4px #c963b3,
                    0 0 9px #8b57b8,
                    0 0 16px #4e3480;
            }
            100% {
                text-shadow:
                    0 0 1px #000,
                    1px 1px 2px #000,
                    -1px -1px 2px #000,
                    0 0 5px #6098c8,
                    0 0 11px #5468a8,
                    0 0 18px #402c70;
            }
        }

        .switch-box {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #d6e0f0;
            font-size: 15px;
            text-shadow:
                1px 1px 2px #000,
                -1px -1px 2px #000;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: none;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            transition: 0.35s;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 2px;
            background: #fff;
            border-radius: 50%;
            transition: 0.35s;
            box-shadow: 0 0 6px #9e60aa;
        }

        input:checked + .slider {
            background: rgba(120, 75, 170, 0.40);
            box-shadow: 0 0 10px rgba(160, 90, 180, 0.45);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .domain-list {
            display: flex;
            flex-direction: column;
            gap: 28px;
            align-items: flex-start;
        }

        .domain-item {
            position: relative;
            padding: 10px 8px;
            font-size: 25px;
            font-weight: 600;
            letter-spacing: 1.2px;
            cursor: none !important;
            transition: all 0.32s ease;
            white-space: nowrap;

            color: #f0f0f8;
            text-shadow:
                0 0 1px #000,
                1px 1px 2px #000,
                -1px -1px 2px #000,
                0 0 3px #9468b0,
                0 0 7px #523880;
        }

        .domain-item::before {
            content: '';
            position: absolute;
            left: 8px;
            bottom: 6px;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #b068a2, #6878b8);
            transition: width 0.32s ease;
            filter: blur(0.5px);
        }

        .domain-item:hover {
            transform: translateY(-4px) scale(1.04);
            color: #ffffff;
            text-shadow:
                0 0 1px #000,
                1px 1px 2px #000,
                -1px -1px 2px #000,
                0 0 5px #b470aa,
                0 0 12px #7050a0;
        }

        .domain-item:hover::before {
            width: calc(100% - 16px);
        }

        .domain-item .full-url {
            position: absolute;
            top: 112%;
            left: 8px;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.4px;
            color: #e4e0f0;
            opacity: 0;
            transform: translateY(-3px);
            transition: all 0.28s ease;
            pointer-events: none;

            text-shadow:
                1px 1px 2px #000,
                -1px -1px 2px #000,
                2px 2px 3px rgba(0,0,0,0.8);
        }

        .domain-item:hover .full-url {
            opacity: 1;
            transform: translateY(0);
        }

        /* 播放器完全透明无黑框 */
        .music-box {
            position: fixed;
            left: 4vw;
            bottom: 4vh;
            z-index: 3;
            width: 320px;
            padding: 0;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        #audio {
            width: 100%;
            height: 38px;
            border-radius: 50px;
            background: transparent;
            border: none;
            outline: none;
            cursor: none !important;
        }
        #audio::-webkit-media-controls-panel {
            background: transparent !important;
        }
        #audio::-webkit-media-controls-play-button,
        #audio::-webkit-media-controls-mute-button {
            filter: brightness(3);
        }
        #audio::-webkit-slider-runnable-track {
            background: rgba(255,255,255,0.2);
        }
        #audio::-webkit-slider-thumb {
            background: #fff;
            box-shadow: 0 0 6px rgba(255,255,255,0.9);
        }
        #audio::-webkit-media-controls-current-time-display,
        #audio::-webkit-media-controls-time-remaining-display {
            color: #fff;
            text-shadow: 1px 1px 2px #000,-1px -1px 2px #000;
        }

        /* 双层反向旋转光环光标 */
        #cursor {
            position: fixed;
            width: 44px;
            height: 44px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
        }
        .ring-outer{
            width:100%;
            height:100%;
            border:1px solid rgba(110,180,220,0.6);
            border-radius:50%;
            animation: rotateSlow 9s linear infinite;
        }
        .ring-inner{
            position:absolute;
            width:65%;
            height:65%;
            border:2px solid rgba(200,110,180,0.7);
            border-radius:50%;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            animation: rotateReverse 6s linear infinite, pulse 2.4s ease-in-out infinite;
            box-shadow:0 0 8px #885499;
        }
        .center-dot{
            position:absolute;
            width:7px;
            height:7px;
            background:#fff;
            border-radius:50%;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            box-shadow:0 0 10px #ffffff,0 0 16px #5878a8;
        }
        @keyframes rotateSlow{
            from{transform:rotate(0deg)}
            to{transform:rotate(360deg)}
        }
        @keyframes rotateReverse{
            from{transform:translate(-50%,-50%) rotate(360deg)}
            to{transform:translate(-50%,-50%) rotate(0deg)}
        }
        @keyframes pulse{
            0%,100%{transform:translate(-50%,-50%) scale(1)}
            50%{transform:translate(-50%,-50%) scale(1.15)}
        }
    </style>
</head>
<body>
    <div id="cursor">
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        <div class="center-dot"></div>
    </div>

    <div class="container">
        <div class="title-wrap">
            <h1 class="title" data-text="TEST">TEST</h1>
            <div class="switch-box">
                <span>new</span>
                <label class="switch">
                    <input type="checkbox" id="targetSwitch">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="domain-list">
            <div class="domain-item" data-href="https://thanatosolo.dpdns.org">
                DPDNS.ORG
                <span class="full-url">https://thanatosolo.dpdns.org</span>
            </div>
            <div class="domain-item" data-href="https://thanatosolo.kdns.fr">
                KDNS.FR
                <span class="full-url">https://thanatosolo.kdns.fr</span>
            </div>
            <div class="domain-item" data-href="http://w.thanatosolo.ddns.ge">
                DDNS.GE
                <span class="full-url">http://w.thanatosolo.ddns.ge</span>
            </div>
            <div class="domain-item" data-href="http://www.thanatos.l.cd">
                L.CD
                <span class="full-url">http://www.thanatos.l.cd</span>
            </div>
        </div>
    </div>

    <div class="music-box" id="musicContainer">
        <audio id="audio" controls preload="auto" playsinline>
        
    </div>

    <script>
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        const targetSwitch = document.getElementById('targetSwitch');
        const domainItems = document.querySelectorAll('.domain-item');
        const STORAGE_KEY = 'linkTargetMode';

        let openNewTab = localStorage.getItem(STORAGE_KEY) === '1';
        targetSwitch.checked = openNewTab;

        targetSwitch.addEventListener('change', () => {
            openNewTab = targetSwitch.checked;
            localStorage.setItem(STORAGE_KEY, openNewTab ? '1' : '0');
        });

        domainItems.forEach(item => {
            item.addEventListener('click', e => {
                e.stopPropagation();
                const url = item.dataset.href;
                if (openNewTab) {
                    window.open(url, '_blank');
                } else {
                    location.href = url;
                }
            });
        });

        // 歌曲链接列表
        const mp3List = [
            "https://music.163.com/song/media/outer/url?id=36089001.mp3",
            "https://music.163.com/song/media/outer/url?id=27599066.mp3",
            "https://music.163.com/song/media/outer/url?id=4154863.mp3",
            "https://music.163.com/song/media/outer/url?id=33527503.mp3",
            "https://music.163.com/song/media/outer/url?id=29017025.mp3"
        ];
        const audio = document.getElementById('audio');
        audio.volume = 0.3;
        audio.loop = true;
        let audioLoaded = false; // 刷新页面自动重置为false

        function randomPlay() {
            const randomUrl = mp3List[Math.floor(Math.random() * mp3List.length)];
            audio.src = randomUrl;
            audio.load();
            audioLoaded = true;
        }

        // 空白点击：仅未加载时才执行加载播放，已加载后点击空白无任何效果
        document.body.addEventListener('click', e => {
            const isDomain = e.target.closest('.domain-item');
            const isSwitch = e.target.closest('.switch');
            const isPlayer = e.target.closest('.music-box');
            // 满足：空白点击 + 还没加载过音乐
            if (!isDomain && !isSwitch && !isPlayer && !audioLoaded) {
                randomPlay();
                audio.play().catch(err => {});
            }
        });

        // 兜底：直接点播放器播放按钮加载歌曲
        audio.addEventListener('play', () => {
            if (!audioLoaded) {
                randomPlay();
            }
        });
    </script>
</body>
</html>
