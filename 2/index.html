<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 36px;
            overflow-x: hidden;
            cursor: none;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-color: rgba(255,255,255,0.18);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .title {
            font-size: 32px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.35);
            margin-bottom: 42px;
        }

        /* 3D翻转卡片 */
        .domain-card-wrap {
            display: flex;
            flex-direction: column;
            gap: 22px;
            align-items: center;
            margin-bottom: 40px;
        }
        .flip-card {
            width: 320px;
            height: 90px;
            perspective: 1200px;
            pointer-events: auto;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
        }
        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 14px;
            backdrop-filter: blur(8px);
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .flip-back {
            transform: rotateY(180deg);
        }
        .domain-name {
            font-size: 24px;
            font-weight: 500;
            color: #fff;
            letter-spacing: 2px;
        }
        .domain-link-text {
            font-size: 14px;
            color: #fff;
            padding: 0 10px;
            word-break: break-all;
        }
        .flip-card a{
            display:block;
            width:100%;
            height:100%;
            text-decoration:none;
        }

        .music-box {
            position: relative;
            z-index: 2;
            display: none;
            margin-top:12px;
        }
        /* 画布层：线条拖尾 + 点击波纹 */
        #canvasMouse {
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            pointer-events: none;
            z-index:1;
        }
        /* 圆环自定义光标 */
        #cursor {
            position: fixed;
            width: 22px;
            height:22px;
            border-radius:50%;
            border: 2px solid #fff;
            background: transparent;
            transform: translate(-50%,-50%);
            pointer-events: none;
            z-index:9999;
            box-shadow: 0 0 8px rgba(255,255,255,0.4);
        }
        #cursor::after{
            content:"";
            position:absolute;
            width:4px;
            height:4px;
            background:#fff;
            border-radius:50%;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
        }
    </style>
</head>
<body>
<canvas id="canvasMouse"></canvas>
<div id="cursor"></div>

<div class="container">
    <h1 class="title">测试</h1>
    <div class="domain-card-wrap">
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-front">
                    <a href="http://w.thanatosolo.ddns.ge" target="_blank">
                        <div class="domain-name">DDNS.GE</div>
                    </a>
                </div>
                <div class="flip-back">
                    <a href="http://w.thanatosolo.ddns.ge" target="_blank">
                        <div class="domain-link-text">http://w.thanatosolo.ddns.ge</div>
                    </a>
                </div>
            </div>
        </div>
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-front">
                    <a href="https://thanatosolo.dpdns.org" target="_blank">
                        <div class="domain-name">DPDNS.ORG</div>
                    </a>
                </div>
                <div class="flip-back">
                    <a href="https://thanatosolo.dpdns.org" target="_blank">
                        <div class="domain-link-text">https://thanatosolo.dpdns.org</div>
                    </a>
                </div>
            </div>
        </div>
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-front">
                    <a href="https://thanatosolo.kdns.fr" target="_blank">
                        <div class="domain-name">KDNS.FR</div>
                    </a>
                </div>
                <div class="flip-back">
                    <a href="https://thanatosolo.kdns.fr" target="_blank">
                        <div class="domain-link-text">https://thanatosolo.kdns.fr</div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="music-box" id="musicContainer">
        <iframe allow="autoplay" frameborder="no" border="0" marginwidth="0" marginheight="0" width=298 height=52 src=""></iframe>
    </div>
</div>

<script>
// 圆环光标跟随
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove',e=>{
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
})

// 音乐控制：全局任意点击触发一次播放器加载，防止重复加载
const musicContainer = document.getElementById('musicContainer');
const iframe = musicContainer.querySelector('iframe');
let audioLoaded = false;
document.body.addEventListener('click',()=>{
    if(!audioLoaded){
        iframe.src = "//music.163.com/outchain/player?type=2&id=20753116&auto=1&height=32";
        musicContainer.style.display = 'block';
        audioLoaded = true;
    }
})

// 画布：线条拖尾 + 点击波纹特效
const canvas = document.getElementById("canvasMouse");
const ctx = canvas.getContext("2d");
let width,height;
const trailPoints = [];
const maxTrailLength = 35;
// 点击波纹数组
let rippleList = [];

function resizeCanvas(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

// 鼠标移动记录轨迹
window.addEventListener('mousemove',(e)=>{
    trailPoints.push({x:e.clientX,y:e.clientY});
    if(trailPoints.length > maxTrailLength){
        trailPoints.shift();
    }
})
// 点击生成波纹
window.addEventListener('click',e=>{
    rippleList.push({
        x:e.clientX,
        y:e.clientY,
        radius:5,
        alpha:1
    })
})

function animate(){
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(0,0,width,height);

    // 炫彩鼠标拖尾线条
    ctx.lineCap = "round";
    for(let i=1;i<trailPoints.length;i++){
        const p1 = trailPoints[i-1];
        const p2 = trailPoints[i];
        const hue = (i * 10 + Date.now() * 0.05) % 360;
        const alpha = i / trailPoints.length;
        ctx.beginPath();
        ctx.moveTo(p1.x,p1.y);
        ctx.lineTo(p2.x,p2.y);
        ctx.strokeStyle = `hsla(${hue}, 85%, 65%, ${alpha})`;
        ctx.lineWidth = alpha * 4;
        ctx.stroke();
    }

    // 点击扩散波纹特效
    for(let i=rippleList.length-1;i>=0;i--){
        const r = rippleList[i];
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(255,255,255,${r.alpha})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        r.radius +=2;
        r.alpha -=0.025;
        if(r.alpha <=0){
            rippleList.splice(i,1);
        }
    }
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
