<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 36px;
            overflow-x: hidden;
            cursor: none;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-color: rgba(255,255,255,0.18);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .title {
            font-size: 32px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.35);
            margin-bottom: 42px;
        }

        /* ========== 3D翻转卡片核心样式 ========== */
        .domain-card-wrap {
            display: flex;
            flex-direction: column;
            gap: 22px;
            align-items: center;
            margin-bottom: 40px;
        }
        .flip-card {
            width: 320px;
            height: 90px;
            perspective: 1200px;
            pointer-events: auto;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
        }
        /* hover触发翻转 */
        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 14px;
            backdrop-filter: blur(8px);
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .flip-back {
            transform: rotateY(180deg);
        }
        .domain-name {
            font-size: 24px;
            font-weight: 500;
            color: #fff;
            letter-spacing: 2px;
        }
        .domain-link-text {
            font-size: 14px;
            color: #fff;
            padding: 0 10px;
            word-break: break-all;
        }

        /* 音乐按钮 */
        .audio-btn {
            padding: 12px 30px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(6px);
            color: #fff;
            border-radius: 999px;
            font-size: 16px;
            transition: 0.3s;
        }
        .audio-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .music-box {
            position: relative;
            z-index: 2;
            display: none;
            margin-top:12px;
        }
        /* 鼠标线条拖尾画布 */
        #canvasMouse {
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            pointer-events: none;
            z-index:1;
        }
        /* 自定义炫彩圆点光标 */
        #cursor {
            position: fixed;
            width: 16px;
            height:16px;
            border-radius:50%;
            background: linear-gradient(45deg,#ff6b6b,#4ecdc4,#ffe066,#a855f7);
            background-size: 300% 300%;
            animation: gradientRotate 2s linear infinite;
            transform: translate(-50%,-50%);
            pointer-events: none;
            z-index:9999;
            box-shadow: 0 0 12px rgba(255,255,255,0.6);
        }
        @keyframes gradientRotate{
            0%{background-position:0% 50%}
            50%{background-position:100% 50%}
            100%{background-position:0% 50%}
        }
    </style>
</head>
<body>
<canvas id="canvasMouse"></canvas>
<div id="cursor"></div>

<div class="container">
    <h1 class="title">测试</h1>
    <div class="domain-card-wrap">
        <!--卡片1-->
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-front">
                    <div class="domain-name">DDNS.GE</div>
                </div>
                <div class="flip-back">
                    <div class="domain-link-text">http://w.thanatosolo.ddns.ge</div>
                </div>
            </div>
        </div>
        <!--卡片2-->
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-front">
                    <div class="domain-name">DPDNS.ORG</div>
                </div>
                <div class="flip-back">
                    <div class="domain-link-text">https://thanatosolo.dpdns.org</div>
                </div>
            </div>
        </div>
        <!--卡片3-->
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-front">
                    <div class="domain-name">KDNS.FR</div>
                </div>
                <div class="flip-back">
                    <div class="domain-link-text">https://thanatosolo.kdns.fr</div>
                </div>
            </div>
        </div>
    </div>

    <button class="audio-btn" id="playBtn">点击开启背景音乐</button>
    <div class="music-box" id="musicContainer">
        <iframe allow="autoplay" frameborder="no" border="0" marginwidth="0" marginheight="0" width=298 height=52 src=""></iframe>
    </div>
</div>

<script>
// 跟随光标
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove',e=>{
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
})

// 音乐按钮逻辑：点击后填充带自动播放的iframe地址
const playBtn = document.getElementById('playBtn');
const musicContainer = document.getElementById('musicContainer');
const iframe = musicContainer.querySelector('iframe');
playBtn.addEventListener('click',()=>{
    iframe.src = "//music.163.com/outchain/player?type=2&id=20753116&auto=1&height=32";
    musicContainer.style.display = 'block';
    playBtn.innerText = "音乐已开启";
    playBtn.disabled = true;
})

// ===================== 新版：流光线条鼠标拖尾特效 =====================
const canvas = document.getElementById("canvasMouse");
const ctx = canvas.getContext("2d");
let width,height;
const trailPoints = [];
const maxTrailLength = 35;

function resizeCanvas(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

window.addEventListener('mousemove',(e)=>{
    trailPoints.push({x:e.clientX,y:e.clientY});
    if(trailPoints.length > maxTrailLength){
        trailPoints.shift();
    }
})

function animate(){
    // 拖尾渐变淡出效果
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(0,0,width,height);

    ctx.lineCap = "round";
    for(let i=1;i<trailPoints.length;i++){
        const p1 = trailPoints[i-1];
        const p2 = trailPoints[i];
        // 渐变色 hsl动态变色
        const hue = (i * 10 + Date.now() * 0.05) % 360;
        const alpha = i / trailPoints.length;
        ctx.beginPath();
        ctx.moveTo(p1.x,p1.y);
        ctx.lineTo(p2.x,p2.y);
        ctx.strokeStyle = `hsla(${hue}, 85%, 65%, ${alpha})`;
        ctx.lineWidth = alpha * 4;
        ctx.stroke();
    }
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
