<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: url('https://pic1.imgdb.cn/i/033xh33EZ3PtL19TphPUL3.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: "Microsoft YaHei", sans-serif;
            overflow-x: hidden;
            cursor: none;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.18);
            z-index: -1;
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            /* 整体向下靠拢，取消垂直居中 */
            justify-content:flex-start;
            padding-top: 18vh;
            gap:36px;
        }
        .title-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .title {
            font-size: 32px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.35);
        }
        /* 跳转开关样式 */
        .switch-box {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 14px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: none;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            border-radius: 22px;
            transition: .3s;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: .3s;
        }
        input:checked + .slider {
            background: rgba(100,200,255,0.4);
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* 3D翻转卡片【改动：完全透明，尺寸自适应】 */
        .domain-card-wrap {
            display: flex;
            flex-direction: column;
            gap: 22px;
            align-items: center;
            margin-bottom: 40px;
        }
        .flip-card {
            width: auto;
            height: 90px;
            perspective: 1200px;
            pointer-events: auto;
            cursor: none !important;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease;
            transform-style: preserve-3d;
        }
        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            padding: 12px 24px;
            /* 全部透明：去除背景、边框、毛玻璃 */
            background: transparent;
            border:none;
            backdrop-filter:none;
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            cursor: none !important;
        }
        .flip-back {
            transform: rotateY(180deg);
        }
        .domain-name {
            font-size: 24px;
            font-weight: 500;
            color: #fff;
            letter-spacing: 2px;
        }
        .domain-link-text {
            font-size: 14px;
            color: #fff;
            word-break: break-all;
        }
        .flip-card a{
            display:block;
            width:100%;
            height:100%;
            text-decoration:none;
            cursor: none !important;
        }

        .music-box {
            position: relative;
            z-index: 2;
            margin-top:12px;
        }
        /* 画布层：点阵拖尾 */
        #canvasMouse {
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            pointer-events: none;
            z-index:1;
            background: transparent;
        }

        /* ========= CSS动态光标【方案A 旋转+呼吸光圈】 ========= */
        #cursor {
            position: fixed;
            width: 26px;
            height: 26px;
            transform: translate(-50%,-50%);
            pointer-events: none;
            z-index:9999;
        }
        .cursor-ring{
            width:100%;
            height:100%;
            border: 2px solid #fff;
            border-radius:50%;
            animation: rotate 4s linear infinite, breathe 2.5s ease-in-out infinite;
        }
        .cursor-dot{
            position:absolute;
            width:5px;
            height:5px;
            background:#fff;
            border-radius:50%;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            animation: flicker 1.2s ease-in-out infinite;
        }
        @keyframes rotate {
            from{transform:rotate(0deg)}
            to{transform:rotate(360deg)}
        }
        @keyframes breathe {
            0%,100%{transform:scale(1)}
            50%{transform:scale(1.25)}
        }
        @keyframes flicker {
            0%,100%{opacity:1}
            50%{opacity:0.35}
        }
    </style>
</head>
<body>
<canvas id="canvasMouse"></canvas>
<!-- 动态光标DOM结构 -->
<div id="cursor">
    <div class="cursor-ring"></div>
    <div class="cursor-dot"></div>
</div>

<div class="container">
    <div class="title-wrap">
        <h1 class="title">测试</h1>
        <div class="switch-box">
            <span>新标签打开</span>
            <label class="switch">
                <input type="checkbox" id="targetSwitch">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="domain-card-wrap">
        <div class="flip-card" data-href="http://w.thanatosolo.ddns.ge">
            <div class="flip-card-inner">
                <div class="flip-front">
                    <a href="javascript:void(0)">
                        <div class="domain-name">DDNS.GE</div>
                    </a>
                </div>
                <div class="flip-back">
                    <a href="javascript:void(0)">
                        <div class="domain-link-text">http://w.thanatosolo.ddns.ge</div>
                    </a>
                </div>
            </div>
        </div>
        <div class="flip-card" data-href="https://thanatosolo.dpdns.org">
            <div class="flip-card-inner">
                <div class="flip-front">
                    <a href="javascript:void(0)">
                        <div class="domain-name">DPDNS.ORG</div>
                    </a>
                </div>
                <div class="flip-back">
                    <a href="javascript:void(0)">
                        <div class="domain-link-text">https://thanatosolo.dpdns.org</div>
                    </a>
                </div>
            </div>
        </div>
        <div class="flip-card" data-href="https://thanatosolo.kdns.fr">
            <div class="flip-card-inner">
                <div class="flip-front">
                    <a href="javascript:void(0)">
                        <div class="domain-name">KDNS.FR</div>
                    </a>
                </div>
                <div class="flip-back">
                    <a href="javascript:void(0)">
                        <div class="domain-link-text">https://thanatosolo.kdns.fr</div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="music-box" id="musicContainer">
        <iframe allow="autoplay" frameborder="no" border="0" marginwidth="0" marginheight="0" width=298 height=52 src=""></iframe>
    </div>
</div>

<script>
// 动态光标跟随
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove',e=>{
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
})

// ========== 跳转开关 + 本地记忆 ==========
const targetSwitch = document.getElementById('targetSwitch');
const flipCards = document.querySelectorAll('.flip-card');
const STORAGE_KEY = 'linkTargetMode';
let openNewTab = localStorage.getItem(STORAGE_KEY) === '1';
targetSwitch.checked = openNewTab;

targetSwitch.addEventListener('change', ()=>{
    openNewTab = targetSwitch.checked;
    localStorage.setItem(STORAGE_KEY, openNewTab ? '1' : '0');
})

flipCards.forEach(card=>{
    card.addEventListener('click',(e)=>{
        e.stopPropagation();
        const url = card.dataset.href;
        if(openNewTab){
            window.open(url,'_blank');
        }else{
            location.href = url;
        }
    })
})

// ========== 音乐加载逻辑：仅点击空白区域生效 ==========
const musicContainer = document.getElementById('musicContainer');
const iframe = musicContainer.querySelector('iframe');
let audioLoaded = false;
document.body.addEventListener('click',(e)=>{
    const isClickCard = e.target.closest('.flip-card');
    const isClickSwitch = e.target.closest('.switch');
    if(!isClickCard && !isClickSwitch && !audioLoaded){
        iframe.src = "//music.163.com/outchain/player?type=2&id=20753116&auto=1&height=32";
        audioLoaded = true;
    }
})

// ========== Canvas：点阵圆点拖尾（无连线） ==========
const canvas = document.getElementById("canvasMouse");
const ctx = canvas.getContext("2d");
let width,height;
// 点阵队列
const dots = [];
const maxDotCount = 22;

function resizeCanvas(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

window.addEventListener('mousemove',(e)=>{
    dots.push({x:e.clientX,y:e.clientY,alpha:1});
    if(dots.length > maxDotCount) dots.shift();
})

function animate(){
    ctx.clearRect(0,0,width,height);
    // 循环绘制一串圆点
    for(let i=0;i<dots.length;i++){
        const point = dots[i];
        point.alpha -= 0.045;
        if(point.alpha <=0) continue;
        ctx.beginPath();
        ctx.arc(point.x, point.y, 3, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,255,255,${point.alpha})`;
        ctx.fill();
    }
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
