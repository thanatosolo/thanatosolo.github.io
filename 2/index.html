<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域名导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: url('https://img2.baidu.com/it/u=1289005344,3029423129&fm=253&fmt=auto&app=138&f=JPEG?w=1920&h=1080') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            overflow-x: hidden;
        }
        /* 遮罩提亮，防止背景太暗 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-color: rgba(255,255,255,0.25);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .title {
            font-size: 32px;
            color: #2c3e50;
            text-shadow: 0 2px 8px rgba(255,255,255,0.6);
            margin-bottom: 36px;
        }
        .domain-card-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
        }
        .domain-card {
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.45);
            padding: 22px 32px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.7);
            transition: all 0.3s ease;
            min-width: 260px;
        }
        .domain-card:hover {
            transform: translateY(-6px);
            background: rgba(255,255,255,0.65);
            box-shadow: 0 8px 24px rgba(80,140,200,0.18);
        }
        .domain-url {
            font-size: 15px;
            color: #34495e;
            margin-bottom: 8px;
            word-break: break-all;
        }
        .domain-name {
            font-size: 22px;
            font-weight: bold;
            color: #2980b9;
        }
        .music-box {
            position: relative;
            z-index: 2;
        }
        /* 鼠标粒子画布 */
        #canvasMouse {
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            pointer-events: none;
            z-index:1;
        }
    </style>
</head>
<body>
<canvas id="canvasMouse"></canvas>

<div class="container">
    <h1 class="title">域名入口</h1>
    <div class="domain-card-wrap">
        <div class="domain-card">
            <div class="domain-url">http://w.thanatosolo.ddns.ge</div>
            <div class="domain-name">DDNS.GE</div>
        </div>
        <div class="domain-card">
            <div class="domain-url">https://thanatosolo.dpdns.org</div>
            <div class="domain-name">DPDNS.ORG</div>
        </div>
        <div class="domain-card">
            <div class="domain-url">https://thanatosolo.kdns.fr</div>
            <div class="domain-name">KDNS.FR</div>
        </div>
    </div>
</div>

<div class="music-box">
<iframe frameborder="no" border="0" marginwidth="0" marginheight="0" width=298 height=52 src="//music.163.com/outchain/player?type=2&id=20753116&auto=1&height=32"></iframe>
</div>

<script>
// 鼠标粒子跟随特效
const canvas = document.getElementById("canvasMouse");
const ctx = canvas.getContext("2d");
let width,height;
let particles = [];

function resizeCanvas(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

class Particle{
    constructor(x,y){
        this.x = x;
        this.y = y;
        this.radius = Math.random()*3+1;
        this.color = `rgba(80,160,220,${Math.random()*0.4+0.1})`;
        this.vx = (Math.random()-0.5)*1.2;
        this.vy = (Math.random()-0.5)*1.2;
        this.life = 100;
    }
    update(){
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
    }
    draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
}

window.addEventListener('mousemove',(e)=>{
    for(let i=0;i<3;i++){
        particles.push(new Particle(e.clientX,e.clientY));
    }
})

function animate(){
    ctx.clearRect(0,0,width,height);
    for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.update();
        p.draw();
        if(p.life <= 0){
            particles.splice(i,1);
        }
    }
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
