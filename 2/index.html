<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('https://pic1.imgdb.cn/i/033xh33EZ3PtL19TphPUL3.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            overflow-x: hidden;
            cursor: none;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.28);
            z-index: -1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: left;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 6vh 4vw;
            gap: 48px;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            gap: 26px;
            flex-wrap: wrap;
        }

        .title {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: 8px;
            color: #ffffff;
            position: relative;
            text-shadow:
                0 0 2px #fff,
                0 0 6px #c963b3,
                0 0 12px #8b57b8,
                0 0 22px #4e3480;

            animation: titleNeonGlow 3.8s ease-in-out infinite alternate;
        }

        .title::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            color: transparent;
            background: linear-gradient(135deg, #b87890, #a070b8, #7c68b4);
            background-clip: text;
            -webkit-background-clip: text;
            opacity: 0.7;
            z-index: -1;
            filter: blur(1px);
        }

        @keyframes titleNeonGlow {
            0% {
                text-shadow:
                    0 0 2px #fff,
                    0 0 6px #c963b3,
                    0 0 12px #8b57b8,
                    0 0 22px #4e3480;
            }
            100% {
                text-shadow:
                    0 0 2px #fff,
                    0 0 8px #6098c8,
                    0 0 16px #5468a8,
                    0 0 26px #402c70;
            }
        }

        .switch-box {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #d6e0f0;
            font-size: 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: none;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            transition: 0.35s;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 2px;
            background: #fff;
            border-radius: 50%;
            transition: 0.35s;
            box-shadow: 0 0 6px #9e60aa;
        }

        input:checked + .slider {
            background: rgba(120, 75, 170, 0.40);
            box-shadow: 0 0 10px rgba(160, 90, 180, 0.45);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .domain-list {
            display: flex;
            flex-direction: column;
            gap: 28px;
            align-items: flex-start;
        }

        .domain-item {
            position: relative;
            padding: 10px 8px;
            font-size: 25px;
            font-weight: 600;
            letter-spacing: 1.2px;
            cursor: none !important;
            transition: all 0.32s ease;
            white-space: nowrap;

            color: #f0f0f8;
            text-shadow:
                0 0 1px #fff,
                0 0 4px #9468b0,
                0 0 9px #523880;
        }

        .domain-item::before {
            content: '';
            position: absolute;
            left: 8px;
            bottom: 6px;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #b068a2, #6878b8);
            transition: width 0.32s ease;
            filter: blur(0.5px);
        }

        .domain-item:hover {
            transform: translateY(-4px) scale(1.04);
            color: #ffffff;
            text-shadow:
                0 0 2px #fff,
                0 0 6px #b470aa,
                0 0 14px #7050a0;
        }

        .domain-item:hover::before {
            width: calc(100% - 16px);
        }

        .domain-item .full-url {
            position: absolute;
            top: 112%;
            left: 8px;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.4px;
            color: #e4e0f0;
            opacity: 0;
            transform: translateY(-3px);
            transition: all 0.28s ease;
            pointer-events: none;

            text-shadow:
                0 0 4px #000,
                0 0 6px #604080;
        }

        .domain-item:hover .full-url {
            opacity: 1;
            transform: translateY(0);
        }

        /* 自定义播放器容器，替换原iframe盒子 */
        .music-box {
            position: fixed;
            left: 4vw;
            bottom: 4vh;
            z-index: 3;
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.52);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 0 12px rgba(80, 40, 120, 0.35);
            color:#fff;
        }
        .ctrl-row{
            display:flex;
            align-items:center;
            gap:12px;
            margin:8px 0;
        }
        .music-box input[type="range"]{
            flex:1;
            cursor:none;
        }
        .music-box button{
            padding:5px 12px;
            border:none;
            border-radius:8px;
            cursor:none;
            background:rgba(255,255,255,0.18);
            color:#fff;
        }
        .music-box button:hover{
            background:rgba(255,255,255,0.3);
        }

        /* 双层反向旋转光环光标 */
        #cursor {
            position: fixed;
            width: 44px;
            height: 44px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
        }
        .ring-outer{
            width:100%;
            height:100%;
            border:1px solid rgba(110,180,220,0.6);
            border-radius:50%;
            animation: rotateSlow 9s linear infinite;
        }
        .ring-inner{
            position:absolute;
            width:65%;
            height:65%;
            border:2px solid rgba(200,110,180,0.7);
            border-radius:50%;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            animation: rotateReverse 6s linear infinite, pulse 2.4s ease-in-out infinite;
            box-shadow:0 0 8px #885499;
        }
        .center-dot{
            position:absolute;
            width:7px;
            height:7px;
            background:#fff;
            border-radius:50%;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            box-shadow:0 0 10px #ffffff,0 0 16px #5878a8;
        }
        @keyframes rotateSlow{
            from{transform:rotate(0deg)}
            to{transform:rotate(360deg)}
        }
        @keyframes rotateReverse{
            from{transform:translate(-50%,-50%) rotate(360deg)}
            to{transform:translate(-50%,-50%) rotate(0deg)}
        }
        @keyframes pulse{
            0%,100%{transform:translate(-50%,-50%) scale(1)}
            50%{transform:translate(-50%,-50%) scale(1.15)}
        }
    </style>
</head>
<body>
    <div id="cursor">
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        <div class="center-dot"></div>
    </div>

    <div class="container">
        <div class="title-wrap">
            <h1 class="title" data-text="TEST">TEST</h1>
            <div class="switch-box">
                <span>new</span>
                <label class="switch">
                    <input type="checkbox" id="targetSwitch">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="domain-list">
            <div class="domain-item" data-href="https://thanatosolo.dpdns.org">
                DPDNS.ORG
                <span class="full-url">https://thanatosolo.dpdns.org</span>
            </div>
            <div class="domain-item" data-href="https://thanatosolo.kdns.fr">
                KDNS.FR
                <span class="full-url">https://thanatosolo.kdns.fr</span>
            </div>
            <div class="domain-item" data-href="http://w.thanatosolo.ddns.ge">
                DDNS.GE
                <span class="full-url">http://w.thanatosolo.ddns.ge</span>
            </div>
            <div class="domain-item" data-href="http://www.thanatos.l.cd">
                L.CD
                <span class="full-url">http://www.thanatos.l.cd</span>
            </div>
        </div>
    </div>

    <!-- 替换为自定义播放器结构，移除iframe -->
    <div class="music-box" id="musicContainer">
        <div class="ctrl-row">
            <button id="playBtn">播放</button>
            <input type="range" id="progress" value="0" min="0" max="100">
        </div>
        <div class="ctrl-row">
            <span>🔊</span>
            <input type="range" id="volSlider" min="0" max="100" value="30">
            <span id="volNum">30%</span>
        </div>
    </div>
    <audio id="audio">

    <script>
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        const targetSwitch = document.getElementById('targetSwitch');
        const domainItems = document.querySelectorAll('.domain-item');
        const STORAGE_KEY = 'linkTargetMode';

        let openNewTab = localStorage.getItem(STORAGE_KEY) === '1';
        targetSwitch.checked = openNewTab;

        targetSwitch.addEventListener('change', () => {
            openNewTab = targetSwitch.checked;
            localStorage.setItem(STORAGE_KEY, openNewTab ? '1' : '0');
        });

        domainItems.forEach(item => {
            item.addEventListener('click', e => {
                e.stopPropagation();
                const url = item.dataset.href;
                if (openNewTab) {
                    window.open(url, '_blank');
                } else {
                    location.href = url;
                }
            });
        });

        // ==========音乐相关逻辑【保留随机歌单】==========
        const songIds = [36089001,27599066,4154863,33527503,29017025];
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const progress = document.getElementById('progress');
        const volSlider = document.getElementById('volSlider');
        const volNum = document.getElementById('volNum');

        audio.volume = 0.30; // 初始音量30%
        audio.loop = true;
        let audioLoaded = false;

        // 页面空白点击加载随机歌曲并播放，排除域名、开关点击
        document.body.addEventListener('click', e => {
            const isClickDomain = e.target.closest('.domain-item');
            const isClickSwitch = e.target.closest('.switch');
            const isClickPlayer = e.target.closest('.music-box');
            if (!isClickDomain && !isClickSwitch && !audioLoaded) {
                const randomId = songIds[Math.floor(Math.random() * songIds.length)];
                audio.src = `https://api.injahow.cn/meting/api?server=netease&type=song&id=${randomId}`;
                audio.play().catch(err=>{});
                audioLoaded = true;
            }
        });

        // 播放暂停按钮
        playBtn.onclick = ()=>{
            if(audio.paused) audio.play();
            else audio.pause();
        }
        audio.addEventListener('play',()=>playBtn.textContent="暂停");
        audio.addEventListener('pause',()=>playBtn.textContent="播放");

        // 进度条同步
        audio.addEventListener('timeupdate',()=>{
            if(audio.duration) progress.value = audio.currentTime / audio.duration * 100;
        })
        progress.oninput = ()=>{
            audio.currentTime = progress.value / 100 * audio.duration;
        }

        // 音量滑块
        volSlider.oninput = ()=>{
            let val = volSlider.value;
            audio.volume = val / 100;
            volNum.textContent = val + "%";
        }
    </script>
</body>
</html>
