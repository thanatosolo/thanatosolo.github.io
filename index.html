<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thanatosolo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }
        .container { max-width: 700px; width: 100%; text-align: center; }
        .logo { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 28px; font-weight: 600; margin-bottom: 4px; }
        .sub { color: #999; font-size: 14px; margin-bottom: 12px; }
        .search-box {
            width: 100%;
            padding: 14px 20px;
            border-radius: 50px;
            border: 2px solid #e0e4ea;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            margin-bottom: 30px;
            background: #fff;
        }
        .search-box:focus { border-color: #4A90D9; box-shadow: 0 0 0 4px rgba(74,144,217,0.1); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 16px;
        }
        .card {
            display: block;
            background: #fff;
            padding: 18px 8px;
            border-radius: 16px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #e8ecf2;
            transition: 0.15s;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .card .icon { font-size: 32px; display: block; margin-bottom: 6px; }
        /* 切换开关样式 */
        .switch-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #4A90D9; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>
    <div class="container">
        <!-- 图标换成服务器🖥️，标题改为thanatosolo -->
        <div class="logo">🖥️</div>
        <h1>thanatosolo</h1>
        <p class="sub">输入关键词搜索 · 或点击下方图标</p>

        <!-- 新标签打开开关 -->
        <div class="switch-wrap">
            <span>新标签打开链接</span>
            <label class="switch">
                <input type="checkbox" id="newtabSwitch">
                <span class="slider"></span>
            </label>
        </div>

        <input class="search-box" type="text" placeholder="输入搜索内容..." onkeydown="if(event.key==='Enter'){window.location.href='https://www.baidu.com/s?wd='+this.value}">
        <div class="grid">
            <a data-href="https://luci.thanatosolo.duckdns.org:8888" class="card"><span class="icon">🖥️</span>iStoreOS</a>
            <a data-href="https://op.thanatosolo.duckdns.org:8888" class="card"><span class="icon">📦</span>OpenList</a>
            <a data-href="https://fb.thanatosolo.duckdns.org:8888" class="card"><span class="icon">📁</span>FileBrowser</a>
            <a data-href="https://ar.thanatosolo.duckdns.org:8888" class="card"><span class="icon">⬇️</span>AriaNG</a>
            <a data-href="https://ssh.thanatosolo.duckdns.org:8888" class="card"><span class="icon">💻</span>TTYD</a>
            <a data-href="https://qb.thanatosolo.duckdns.org:8888" class="card"><span class="icon">🌱</span>qBittorrent</a>
            <a data-href="https://je.thanatosolo.duckdns.org:8888" class="card"><span class="icon">🎬</span>Jellyfin</a>
            <a data-href="https://pp.thanatosolo.duckdns.org:8888" class="card"><span class="icon">🖼️</span>PhotoPrism</a>
            <a data-href="https://kd.thanatosolo.duckdns.org:8888" class="card"><span class="icon">🗂️</span>可道云</a>
            <a data-href="https://mt.thanatosolo.duckdns.org:8888" class="card"><span class="icon">📷</span>MT Photos</a>
            <a data-href="https://ai.thanatosolo.duckdns.org:8888" class="card"><span class="icon">🤖</span>AI</a>
            <a data-href="https://dav.thanatosolo.duckdns.org:8888" class="card"><span class="icon">☁️</span>WebDAV</a>
        </div>
    </div>

<script>
    const switchEl = document.getElementById('newtabSwitch');
    const cards = document.querySelectorAll('.card');
    // 读取本地存储记录
    let useNewTab = localStorage.getItem('openNewTab') === 'true';
    switchEl.checked = useNewTab;

    // 切换开关事件
    switchEl.addEventListener('change', () => {
        useNewTab = switchEl.checked;
        localStorage.setItem('openNewTab', useNewTab);
    });

    // 卡片点击逻辑
    cards.forEach(card => {
        card.addEventListener('click', e => {
            e.preventDefault();
            const url = card.dataset.href;
            if (useNewTab) {
                window.open(url, '_blank');
            } else {
                window.location.href = url;
            }
        });
    });
</script>
</body>
</html>
