<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 30px;
            gap: 72px;
            font-family: "Microsoft YaHei", serif;
            background-image: url("https://pic1.imgdb.cn/i/033xh33EZ3PtL19TphPUL3.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            cursor: none;
        }
        /* 禁止小手光标 */
        a, audio {
            cursor: none !important;
        }
        .link-row {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .art-link {
            font-size: 22px;
            letter-spacing: 2px;
            text-decoration: none;
            color: #ffffff;
            text-shadow: 0 0 2px #000, 0 0 4px #000;
            background-image: linear-gradient(90deg, #fff, #fff);
            background-clip: text;
            -webkit-background-clip: text;
            transition: all 0.4s ease;
            text-transform: uppercase; /* 强制大写 */
        }
        .art-link:hover {
            background-image: linear-gradient(90deg, #ff4d6d, #4cc9f0, #f72585, #4361ee);
            color: transparent;
            text-shadow: 0 0 8px rgba(255,255,255,0.6);
            transform: scale(1.08);
        }
        .audio-box {
            width: 320px;
            backdrop-filter: blur(4px);
            border-radius: 50px;
        }
        /* 播放器极致透明配置 */
        audio {
            width: 100%;
            height: 38px;
            border-radius: 50px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
        }
        /* Chrome/Edge/Safari 控制面板强制透明 */
        audio::-webkit-media-controls-panel {
            background: transparent !important;
        }
        audio::-webkit-media-controls-play-button,
        audio::-webkit-media-controls-mute-button {
            filter: brightness(3);
        }
        audio::-webkit-slider-runnable-track {
            background: rgba(255,255,255,0.2);
        }
        audio::-webkit-slider-thumb {
            background: #fff;
            box-shadow: 0 0 6px rgba(255,255,255,0.9);
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #fff;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
        }
        /* 白色高亮鼠标跟随光标 */
        .cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
            will-change: transform;
            box-shadow: 0 0 6px rgba(255,255,255,0.7);
        }
        .cursor-follower {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease;
            will-change: transform;
            box-shadow: 0 0 4px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <!-- 自定义光标 -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- 大写占位链接 -->
    <div class="link-row">
        <a href="https://thanatosolo.kdns.fr" target="_blank" class="art-link">THANATOSOLO.KDNS.FR</a>
    </div>

    <!-- 透明播放器 -->
    <div class="audio-box">
        <audio id="music" controls preload="auto">
            <source src="https://music.163.com/song/media/outer/url?id=1812453877.mp3" type="audio/mpeg">
            你的浏览器不支持音频播放
        
    </div>

    <!-- 鼠标跟随动画JS -->
    <script>
        const cursor = document.querySelector('.cursor');
        const cursorFollower = document.querySelector('.cursor-follower');
        let mouseX = 0, mouseY = 0;
        let curX = 0, curY = 0;
        let folX = 0, folY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            curX += (mouseX - curX) * 0.1;
            curY += (mouseY - curY) * 0.1;
            cursor.style.left = curX + 'px';
            cursor.style.top = curY + 'px';

            folX += (mouseX - folX) * 0.05;
            folY += (mouseY - folY) * 0.05;
            cursorFollower.style.left = folX + 'px';
            cursorFollower.style.top = folY + 'px';

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // 悬浮放大光标
        const hoverElements = document.querySelectorAll('.art-link, audio');
        hoverElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
            });
        });
    </script>
</body>
</html>
