<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THANATOSOLO</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💀</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('https://pic1.imgdb.cn/i/033xh33EZ3PtL19TphPUL3.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            font-family: "Microsoft YaHei", "PingFang SC", "Inter", sans-serif;
            overflow-x: hidden;
            cursor: none;
            user-select: none;
        }

        .container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 6vh 4vw;
            gap: 48px;
        }

        .sticky-area {
            position: sticky;
            top: 6vh;
            z-index: 50;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 48px;
            background: transparent;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            gap: 26px;
            flex-wrap: wrap;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 8px;
            position: relative;
            background: linear-gradient(90deg, #ff3366, #ff8833, #ffcc33, #33dd88, #33aaff, #aa66ff, #ff33aa, #ff3366);
            background-size: 400% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: textRainbowFlow 8s linear infinite;
            text-shadow: 0 0 30px rgba(255, 100, 200, 0.3);
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .title:hover {
            transform: scale(1.04);
            filter: brightness(1.3);
        }

        @keyframes textRainbowFlow {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 400% 50%;
            }
        }

        .switch-box {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #d6e0f0;
            font-size: 15px;
            font-weight: 500;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.7), 0 0 4px #000;
            padding: 0;
            background: transparent;
            border: none;
            backdrop-filter: none;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(20, 30, 50, 0.5);
            backdrop-filter: blur(6px);
            border-radius: 24px;
            transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.6);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 2px;
            background: radial-gradient(circle at 30% 30%, #f0f0ff, #b0b8ff);
            border-radius: 50%;
            transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 0 16px #9f7aff, 0 0 30px #7f5aff;
        }

        input:checked+.slider {
            background: rgba(140, 70, 200, 0.45);
            border-color: #b580ff;
            box-shadow: 0 0 24px rgba(170, 100, 255, 0.4), inset 0 0 10px rgba(200, 150, 255, 0.3);
        }

        input:checked+.slider:before {
            transform: translateX(26px);
            background: radial-gradient(circle at 30% 30%, #ffffff, #c8a0ff);
            box-shadow: 0 0 30px #b080ff, 0 0 60px #9055ff;
        }

        .domain-list {
            display: flex;
            flex-direction: column;
            gap: 48px;
            align-items: flex-start;
            width: 100%;
            padding-bottom: 100px;
        }

        #domainItemsContainer {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
        }

        .domain-item {
            position: relative;
            padding: 10px 8px 10px 18px;
            font-size: 25px;
            font-weight: 600;
            letter-spacing: 1.2px;
            transition: all 0.32s cubic-bezier(0.2, 0.9, 0.4, 1);
            white-space: nowrap;
            color: #f0f0f8;
            text-shadow: 0 0 2px #000,
                1px 1px 2px #000,
                -1px -1px 2px #000,
                0 0 8px #9468b0,
                0 0 16px #523880;
            border-left: 2px solid transparent;
            width: auto;
            display: inline-block;
        }

        .domain-name {
            display: inline-block;
            transition: all 0.32s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        .domain-name:hover {
            transform: translateY(-4px) scale(1.02);
            color: #ffffff;
            text-shadow: 0 0 2px #000,
                1px 1px 2px #000,
                -1px -1px 2px #000,
                0 0 12px #d080ff,
                0 0 28px #8050c0;
        }

        .domain-name::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #f0a0ff, #80b0ff, #a0f0ff);
            transition: width 0.4s ease;
            filter: blur(1px);
            box-shadow: 0 0 12px #a070ff;
        }

        .domain-name:hover::after {
            width: 100%;
        }

        .domain-item .full-url {
            position: absolute;
            top: 100%;
            left: 18px;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.4px;
            color: #e4e0f0;
            opacity: 0;
            transform: translateY(-3px) scale(0.96);
            transition: all 0.28s cubic-bezier(0.2, 0.9, 0.4, 1);
            pointer-events: none;
            text-shadow: 1px 1px 4px #000,
                -1px -1px 4px #000,
                0 0 12px rgba(0, 0, 0, 0.9);
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            padding: 2px 12px 2px 8px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .domain-name:hover + .full-url,
        .domain-name:hover ~ .full-url {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .music-box {
            position: fixed;
            left: 4vw;
            bottom: 4vh;
            z-index: 100;
            width: 300px;
            padding: 0;
            background: transparent;
            border: none;
            box-shadow: none;
            filter: drop-shadow(0 0 10px rgba(150, 80, 200, 0.2));
            pointer-events: auto;
        }

        #audio {
            width: 100%;
            height: 38px;
            border-radius: 60px;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer !important;
        }

        #audio::-webkit-media-controls-panel {
            background: rgba(10, 5, 20, 0.25) !important;
            backdrop-filter: blur(10px) !important;
            border-radius: 60px !important;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #audio::-webkit-media-controls-play-button,
        #audio::-webkit-media-controls-mute-button {
            filter: drop-shadow(0 0 4px #b080ff) brightness(1.6);
        }

        #audio::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
        }

        #audio::-webkit-slider-thumb {
            background: radial-gradient(circle, #f0e0ff, #a070ff);
            box-shadow: 0 0 20px #b080ff;
            border-radius: 50%;
            height: 14px;
            width: 14px;
        }

        #audio::-webkit-media-controls-current-time-display,
        #audio::-webkit-media-controls-time-remaining-display {
            color: #fff;
            text-shadow: 0 0 12px #000, 0 0 20px #000;
            font-weight: 500;
        }

        #cursor {
            position: fixed;
            width: 60px;
            height: 60px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 20px #b080ff);
        }

        .ring-outer {
            width: 100%;
            height: 100%;
            border: 1.8px solid rgba(160, 220, 255, 0.9);
            border-radius: 50%;
            animation: rotateSlow 12s linear infinite;
            box-shadow: 0 0 30px rgba(100, 180, 255, 0.3), inset 0 0 30px rgba(100, 180, 255, 0.1);
        }

        .ring-inner {
            position: absolute;
            width: 60%;
            height: 60%;
            border: 2.5px solid rgba(255, 140, 220, 0.9);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: rotateReverse 8s linear infinite, pulseGlow 2.8s ease-in-out infinite;
            box-shadow: 0 0 28px #ff70c0, 0 0 50px #b050ff;
        }

        .center-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #ffffff, #b0a0ff);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px #ffffff, 0 0 60px #8060ff, 0 0 100px #a070ff;
            animation: pulseDot 2s ease-in-out infinite alternate;
        }

        @keyframes rotateSlow {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotateReverse {
            from {
                transform: translate(-50%, -50%) rotate(360deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(0deg);
            }
        }

        @keyframes pulseGlow {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }

        @keyframes pulseDot {
            0% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 30px #fff, 0 0 60px #8060ff;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.3);
                box-shadow: 0 0 50px #ffb0ff, 0 0 100px #a070ff;
            }
        }

        #trailCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9998;
            mix-blend-mode: screen;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 24px;
                letter-spacing: 4px;
            }
            .domain-item {
                font-size: 20px;
            }
            .music-box {
                width: 220px;
                left: 2vw;
                bottom: 2vh;
            }
            #cursor {
                width: 44px;
                height: 44px;
            }
            .container {
                padding: 4vh 4vw;
                gap: 32px;
            }
            .sticky-area {
                top: 4vh;
                gap: 32px;
            }
            .switch {
                width: 42px;
                height: 20px;
            }
            .slider:before {
                height: 14px;
                width: 14px;
                left: 3px;
                bottom: 2px;
            }
            input:checked+.slider:before {
                transform: translateX(22px);
            }
            .domain-item .full-url {
                font-size: 12px;
                top: 100%;
                left: 12px;
            }
            #domainItemsContainer {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <canvas id="trailCanvas"></canvas>
    <div id="cursor">
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        <div class="center-dot"></div>
    </div>

    <div class="container">
        <div class="sticky-area" id="stickyArea">
            <div class="title-wrap">
                <h1 class="title" id="mainTitle">THANATOSOLO</h1>
            </div>
            <div class="switch-box">
                <span style="letter-spacing:1px;">new</span>
                <label class="switch">
                    <input type="checkbox" id="targetSwitch">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="domain-list" id="domainList">
            <div id="domainItemsContainer"></div>
        </div>
    </div>

    <div class="music-box" id="musicContainer">
        <audio id="audio" controls preload="auto" playsinline></audio>
    </div>

    <script>
        document.getElementById('mainTitle').addEventListener('click', function(e) {
            e.stopPropagation();
            window.location.href = '/1/';
        });

        const STORAGE_KEY = 'linkTargetMode';

        function getOpenNewTab() {
            return localStorage.getItem(STORAGE_KEY) === '1';
        }

        function renderDomains(domains) {
            const container = document.getElementById('domainItemsContainer');
            container.innerHTML = '';

            if (!domains || domains.length === 0) {
                container.innerHTML = '<div style="color:#8b949e;font-size:16px;padding-left:18px;">暂无数据</div>';
                return;
            }

            domains.forEach(function(item) {
                const div = document.createElement('div');
                div.className = 'domain-item';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'domain-name';
                nameSpan.textContent = item.name;
                nameSpan.dataset.href = item.url;

                const urlSpan = document.createElement('span');
                urlSpan.className = 'full-url';
                urlSpan.textContent = item.url;

                div.appendChild(nameSpan);
                div.appendChild(urlSpan);
                container.appendChild(div);
            });

            document.querySelectorAll('.domain-name').forEach(function(el) {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const url = this.dataset.href;
                    if (getOpenNewTab()) {
                        window.open(url, '_blank');
                    } else {
                        location.href = url;
                    }
                });
            });

            updateFade();
        }

        fetch('data.json?t=' + Date.now())
            .then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function(data) {
                renderDomains(data.domains);
            })
            .catch(function(err) {
                console.error('加载 data.json 失败:', err);
                document.getElementById('domainItemsContainer').innerHTML =
                    '<div style="color:#f85149;font-size:16px;padding-left:18px;">⚠️ 加载 data.json 失败</div>';
            });

        let mp3List = [];
        const audio = document.getElementById('audio');
        audio.volume = 0.3;
        audio.loop = true;

        function randomPlay() {
            if (mp3List.length === 0) return;
            var randomUrl = mp3List[Math.floor(Math.random() * mp3List.length)];
            audio.src = randomUrl;
            audio.load();
            audio.play().catch(function() {});
        }

        fetch('music.json?t=' + Date.now())
            .then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function(data) {
                mp3List = data.songs || [];
                if (mp3List.length > 0) {
                    randomPlay();
                }
            })
            .catch(function(err) {
                console.error('加载 music.json 失败:', err);
                mp3List = [
                    "https://music.163.com/song/media/outer/url?id=36089001.mp3",
                    "https://music.163.com/song/media/outer/url?id=27599066.mp3",
                    "https://music.163.com/song/media/outer/url?id=4154863.mp3",
                    "https://music.163.com/song/media/outer/url?id=33527503.mp3",
                    "https://music.163.com/song/media/outer/url?id=29017025.mp3"
                ];
                randomPlay();
            });

        // ★ 首次点击空白处触发音乐播放（只触发一次） ★
        let musicTriggered = false;

        document.body.addEventListener('click', function(e) {
            // 如果已经触发过，或者音频已经在播放，就不重复触发
            if (musicTriggered || !audio.paused) return;

            var isDomainName = e.target.closest('.domain-name');
            var isSwitch = e.target.closest('.switch');
            var isPlayer = e.target.closest('.music-box');
            var isTitle = e.target.closest('.title');

            // 只有点击非交互区域（非域名、非开关、非播放器、非标题）才触发
            if (!isDomainName && !isSwitch && !isPlayer && !isTitle) {
                if (mp3List.length > 0) {
                    randomPlay();
                    musicTriggered = true;
                }
            }
        });

        audio.addEventListener('ended', function() {
            if (mp3List.length > 0) {
                var currentSrc = audio.src;
                var available = mp3List.filter(function(url) { return url !== currentSrc; });
                if (available.length === 0) available = mp3List;
                var randomUrl = available[Math.floor(Math.random() * available.length)];
                audio.src = randomUrl;
                audio.load();
                audio.play().catch(function() {});
            }
        });

        const targetSwitch = document.getElementById('targetSwitch');
        targetSwitch.checked = getOpenNewTab();

        targetSwitch.addEventListener('change', function() {
            localStorage.setItem(STORAGE_KEY, this.checked ? '1' : '0');
        });

        function updateFade() {
            var items = document.querySelectorAll('.domain-item');
            if (items.length === 0) return;

            var stickyRect = document.getElementById('stickyArea').getBoundingClientRect();
            var topFadeLine = stickyRect.bottom;

            var bottomFadeLine = window.innerHeight;
            var bottomReserve = 100;

            items.forEach(function(item) {
                var rect = item.getBoundingClientRect();
                var itemCenter = rect.top + rect.height / 2;

                var distanceFromTop = itemCenter - topFadeLine;
                var topFadeDistance = rect.height * 2;
                var topOpacity = 1;
                if (distanceFromTop < 0) {
                    topOpacity = 0;
                } else if (distanceFromTop < topFadeDistance) {
                    topOpacity = 1 - (1 - distanceFromTop / topFadeDistance);
                }

                var distanceFromBottom = bottomFadeLine - bottomReserve - itemCenter;
                var bottomFadeDistance = rect.height * 2;
                var bottomOpacity = 1;
                if (distanceFromBottom < 0) {
                    bottomOpacity = 0;
                } else if (distanceFromBottom < bottomFadeDistance) {
                    bottomOpacity = 1 - (1 - distanceFromBottom / bottomFadeDistance);
                }

                var finalOpacity = Math.min(topOpacity, bottomOpacity);
                finalOpacity = Math.max(0, Math.min(1, finalOpacity));

                item.style.opacity = finalOpacity;
                item.style.pointerEvents = finalOpacity < 0.1 ? 'none' : 'auto';
            });
        }

        var ticking = false;
        window.addEventListener('scroll', function() {
            if (!ticking) {
                requestAnimationFrame(function() {
                    updateFade();
                    ticking = false;
                });
                ticking = true;
            }
        });

        window.addEventListener('resize', function() {
            updateFade();
        });

        const cursor = document.getElementById('cursor');
        const canvas = document.getElementById('trailCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const trailPoints = [];
        const maxTrailLength = 64;
        let mouseX = 0,
            mouseY = 0;

        document.addEventListener('mousemove', function(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
            trailPoints.push({ x: mouseX, y: mouseY, alpha: 1 });
            if (trailPoints.length > maxTrailLength) trailPoints.shift();
        });

        function drawTrail() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (var i = 1; i < trailPoints.length; i++) {
                var p1 = trailPoints[i - 1];
                var p2 = trailPoints[i];
                p1.alpha -= 0.016;
                if (p1.alpha <= 0) continue;
                var progress = i / trailPoints.length;
                var hue = (280 + progress * 60) % 360;
                var alphaVal = p1.alpha * 0.9;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                var lineWidth = 3.5 + 6 * (1 - progress);
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = 'hsla(' + hue + ', 90%, 70%, ' + alphaVal + ')';
                ctx.shadowColor = 'hsla(' + hue + ', 100%, 70%, 0.6)';
                ctx.shadowBlur = 22;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineWidth = lineWidth * 0.35;
                ctx.strokeStyle = 'hsla(' + (hue + 30) + ', 100%, 90%, ' + (alphaVal * 0.7) + ')';
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'hsla(' + (hue + 20) + ', 100%, 80%, 0.5)';
                ctx.stroke();
            }
            if (trailPoints.length > 2) {
                var last = trailPoints[trailPoints.length - 1];
                ctx.shadowBlur = 80;
                for (var j = 0; j < 6; j++) {
                    var angle = j * 1.2 + Date.now() * 0.001;
                    var dist = 12 + Math.sin(Date.now() * 0.005 + j) * 6;
                    var px = last.x + Math.cos(angle) * dist;
                    var py = last.y + Math.sin(angle) * dist;
                    ctx.beginPath();
                    ctx.arc(px, py, 2 + Math.sin(Date.now() * 0.01 + j) * 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = 'hsla(' + (300 + j * 20) + ', 100%, 80%, 0.5)';
                    ctx.shadowColor = 'hsla(' + (300 + j * 20) + ', 100%, 70%, 0.7)';
                    ctx.shadowBlur = 40;
                    ctx.fill();
                }
            }
            requestAnimationFrame(drawTrail);
        }
        drawTrail();

        setTimeout(function() {
            updateFade();
        }, 100);
    </script>
</body>
</html>
