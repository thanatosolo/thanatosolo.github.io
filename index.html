<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 60px;
            gap: 24px;
            font-family: "Microsoft YaHei", serif;
            /* 原始背景图，无滤镜 */
            background-image: url("https://pic1.imgdb.cn/i/033xh33EZ3PtL19TphPUL3.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            cursor: none; /* 隐藏系统鼠标 */
        }
        /* 所有可交互元素强制取消小手光标 */
        a, audio {
            cursor: none !important;
        }
        /* 横向跳转链接容器 */
        .link-row {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        /* 艺术文字链接，无色块背景 */
        .art-link {
            font-size: 16px;
            letter-spacing: 2px;
            text-decoration: none;
            color: #ffffff;
            text-shadow: 0 0 2px #000, 0 0 4px #000;
            background-image: linear-gradient(90deg, #fff, #fff);
            background-clip: text;
            -webkit-background-clip: text;
            transition: all 0.4s ease;
        }
        /* 悬浮多彩渐变文字 */
        .art-link:hover {
            background-image: linear-gradient(90deg, #ff4d6d, #4cc9f0, #f72585, #4361ee);
            color: transparent;
            text-shadow: 0 0 8px rgba(255,255,255,0.6);
            transform: scale(1.08);
        }
        /* 音频播放器容器 */
        .audio-box {
            width: 300px;
        }
        audio {
            width: 100%;
            height: 40px;
            border-radius: 8px;
        }

        /* ========== 鼠标光标特效样式（修改白色高亮配色，不撞背景） ========== */
        .cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
            will-change: transform;
            box-shadow: 0 0 6px rgba(255,255,255,0.7);
        }
        .cursor-follower {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease;
            will-change: transform;
            box-shadow: 0 0 4px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <!-- 自定义鼠标光标DOM -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- 跳转链接，自行替换 xxxxxxxxxxxxxx -->
    <div class="link-row">
        <a href="thanatosolo.kdns.fr" target="_blank" class="art-link">thanatosolo.kdns.fr</a>
    </div>

    <!-- 音频播放器，无自动播放 -->
    <div class="audio-box">
        <audio id="music" controls preload="auto">
            <source src="https://music.163.com/song/media/outer/url?id=1812453877.mp3" type="audio/mpeg">
            你的浏览器不支持音频播放
        
    </div>

    <!-- 鼠标跟随特效JS -->
    <script>
        const cursor = document.querySelector('.cursor');
        const cursorFollower = document.querySelector('.cursor-follower');
        let mouseX = 0, mouseY = 0;
        let curX = 0, curY = 0;
        let folX = 0, folY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            curX += (mouseX - curX) * 0.1;
            curY += (mouseY - curY) * 0.1;
            cursor.style.left = curX + 'px';
            cursor.style.top = curY + 'px';

            folX += (mouseX - folX) * 0.05;
            folY += (mouseY - folY) * 0.05;
            cursorFollower.style.left = folX + 'px';
            cursorFollower.style.top = folY + 'px';

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // 悬浮链接/播放器时光标放大
        const hoverElements = document.querySelectorAll('.art-link, audio');
        hoverElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
            });
        });
    </script>
</body>
</html>
