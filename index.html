<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 30px;
            gap: 72px;
            font-family: "Microsoft YaHei", serif;
            background-image: url("https://pic1.imgdb.cn/i/033xh33EZ3PtL19TphPUL3.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            cursor: none;
        }
        /* 禁止小手光标 */
        a, iframe {
            cursor: none !important;
        }
        .link-row {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .art-link {
            font-size: 22px;
            letter-spacing: 2px;
            text-decoration: none;
            color: #ffffff;
            text-shadow: 0 0 2px #000, 0 0 4px #000;
            background-image: linear-gradient(90deg, #fff, #fff);
            background-clip: text;
            -webkit-background-clip: text;
            transition: all 0.4s ease;
            text-transform: uppercase;
            position: relative;
        }
        .art-link:hover {
            background-image: linear-gradient(90deg, #ff4d6d, #4cc9f0, #f72585, #4361ee);
            color: transparent;
            text-shadow: 0 0 8px rgba(255,255,255,0.6);
            transform: scale(1.08);
        }
        .art-link::after {
            display: none;
        }
        .iframe-box {
            width: 298px;
            height: 52px;
            backdrop-filter: blur(4px);
            border-radius: 50px;
            overflow: hidden;
            position:relative;
        }
        /* 透明遮罩用于接收点击，用来转发点击到播放器 */
        .trigger-mask{
            position:absolute;
            inset:0;
            z-index:2;
        }
        /* 自定义光标 */
        .cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
            will-change: transform;
            box-shadow: 0 0 6px rgba(255,255,255,0.7);
        }
        .cursor-follower {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease;
            will-change: transform;
            box-shadow: 0 0 4px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <!-- 自定义光标 -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <div class="link-row" id="linkContainer">
        <a href="http://w.thanatosolo.ddns.ge" target="_blank" class="art-link">DDNS.GE</a>
        <a href="https://thanatosolo.dpdns.org" target="_blank" class="art-link">DPDNS.ORG</a>
        <a href="https://thanatosolo.kdns.fr" target="_blank" class="art-link">KDNS.FR</a>
    </div>

    <!-- 网易云iframe播放器 -->
    <div class="iframe-box">
        <iframe id="musicIframe" frameborder="no" border="0" marginwidth="0" marginheight="0" width=298 height=52 
        src="https://music.163.com/outchain/player?type=2&id=1812453877&auto=0&height=32">
        </iframe>
    </div>

    <script>
        const cursor = document.querySelector('.cursor');
        const cursorFollower = document.querySelector('.cursor-follower');
        let mouseX = 0, mouseY = 0;
        let curX = 0, curY = 0;
        let folX = 0, folY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            curX += (mouseX - curX) * 0.1;
            curY += (mouseY - curY) * 0.1;
            cursor.style.left = curX + 'px';
            cursor.style.top = curY + 'px';

            folX += (mouseX - folX) * 0.05;
            folY += (mouseY - folY) * 0.05;
            cursorFollower.style.left = folX + 'px';
            cursorFollower.style.top = folY + 'px';

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // hover放大光标
        const hoverElements = document.querySelectorAll('.art-link, #musicIframe');
        hoverElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'translate(-50%, -50%) scale(1)';
            });
        });

        // 双击跳转
        document.addEventListener('dblclick', function() {
            window.location.href = 'https://thanatosolo.github.io/1';
        });

        // ==========核心播放逻辑==========
        let hasPlay = false;
        const iframe = document.getElementById("musicIframe");

        document.body.addEventListener("click", function(e){
            // 点击链接区域直接跳过，不触发播放
            if(e.target.closest(".art-link")) return;
            if(hasPlay) return;

            hasPlay = true;
            // 方案：把焦点移到iframe，模拟点击播放器区域触发播放
            iframe.focus();
            // 终极兼容方案：重新加载iframe带auto=1（备用兜底）
            setTimeout(()=>{
                iframe.src = "https://music.163.com/outchain/player?type=2&id=1812453877&auto=1&height=32";
            }, 50);
        })
    </script>
</body>
</html>
